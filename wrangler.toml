name = "bauhaus-cms-api"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ── Local dev vars (.dev.vars is the recommended way for secrets) ────────────
# Copy .dev.vars.example to .dev.vars and fill in values for `wrangler dev`

# ── Deployment ───────────────────────────────────────────────────────────────
# Set secrets with:
#   npx wrangler secret put DATABASE_URL
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put CLOUDINARY_CLOUD_NAME
#   npx wrangler secret put CLOUDINARY_API_KEY
#   npx wrangler secret put CLOUDINARY_API_SECRET
#
# Optional plain vars (not secrets):
# [vars]
# ALLOWED_ORIGINS = "https://your-vercel-frontend.vercel.app"
# FRONTEND_URL = "https://your-vercel-frontend.vercel.app"
